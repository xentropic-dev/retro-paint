[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Dev builds optimize third-party crates (GPUI, raylib, image codecs, zip,
# ...) so debug builds start and paint at a usable speed, and keep only line
# tables for them so test binaries link faster.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# The pixel hot paths (flatten, dither, brush stamping, canvas upload) run
# ~20x slower unoptimized, which makes painting lag, so debug builds
# optimize the workspace crates that hold them too. The binary and rp-format
# stay at opt-level 0.
[profile.dev.package.rp-palette-dither]
opt-level = 3

[profile.dev.package.rp-doc]
opt-level = 3

[profile.dev.package.rp-brush]
opt-level = 3

[profile.dev.package.rp-editor]
opt-level = 2

[workspace.dependencies]
rp-palette-dither = { path = "crates/rp-palette-dither" }
rp-doc = { path = "crates/rp-doc" }
rp-format = { path = "crates/rp-format" }
rp-brush = { path = "crates/rp-brush" }
rp-dos = { path = "crates/rp-dos" }
rp-editor = { path = "crates/rp-editor" }
# GPUI from the Zed repo, pinned. Do not bump inside a feature branch.
gpui = { git = "https://github.com/zed-industries/zed", rev = "96984225abc235519e66b5c6c9ed23b87621f868" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "96984225abc235519e66b5c6c9ed23b87621f868", features = ["font-kit", "wayland", "x11"] }
# raylib-rs 6.x: the 5.x `wayland` feature links a system libglfw; 6.x builds the bundled GLFW with Wayland.
raylib = { version = "6.0.0", features = ["GLFW_BUILD_WAYLAND", "SUPPORT_IMAGE_GENERATION"] }
