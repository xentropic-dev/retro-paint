# retro-paint window rules for Hyprland (written for Hyprland 0.56, the
# `match:` windowrule syntax introduced in 0.53).
#
# Source it from ~/.config/hypr/hyprland.conf:
#   source = ~/src/retro-paint/contrib/hyprland.conf
#
# The two windows set these Wayland app_ids (Hyprland's window class):
#   retro-paint-editor   full-color editor with the real UI
#   retro-paint-dos      the DOS CGA view (the window OBS captures)

# --- FILL THESE IN -----------------------------------------------------------
# Monitor names differ per machine. Run `hyprctl monitors` and copy the
# `Monitor <name>` values. Example from a two-monitor setup:
#   DP-1      1920x1080, x=0,    transform 0  (landscape, left)
#   HDMI-A-1  1920x1080, x=1920, transform 1  (rotated 90 deg: 1080x1920, right)
$rp_left = DP-1
$rp_right = HDMI-A-1
# -----------------------------------------------------------------------------

# Editor: left monitor, tiled. Alone on its workspace it fills the monitor.
windowrule = monitor $rp_left, match:class ^(retro-paint-editor)$
windowrule = tile on, match:class ^(retro-paint-editor)$

# DOS view, mobile layout (the default): fill the vertical 9:16 right monitor.
# It floats so the window covers the whole monitor (bars and gaps don't shrink
# it). These rules only set the initial placement. When the project's DOS
# layout changes, retro-paint asks Hyprland (over its IPC socket) to float its
# own DOS window and resize it to the largest 9:16 / 16:9 box that fits its
# monitor, centered; mobile on this vertical monitor fills it again. These
# rules are applied once at map, so they don't fight that resize. Outside
# Hyprland the tube is just refit into whatever size the window has.
windowrule = monitor $rp_right, match:class ^(retro-paint-dos)$
windowrule = float on, match:class ^(retro-paint-dos)$
windowrule = size (monitor_w) (monitor_h), match:class ^(retro-paint-dos)$
windowrule = move 0 0, match:class ^(retro-paint-dos)$
# The DOS view never takes input; keep it from stealing focus from the editor.
windowrule = no_initial_focus on, match:class ^(retro-paint-dos)$

# Captured pixels must be exact CGA colors: no transparency, blur or dimming.
# (`tag -default-opacity` matters on configs, such as Omarchy, that tag every
# window for translucency; it is harmless elsewhere.)
windowrule = tag -default-opacity, match:class ^(retro-paint-dos)$
windowrule = opacity 1 override 1 override, match:class ^(retro-paint-dos)$
windowrule = no_blur on, match:class ^(retro-paint-dos)$
windowrule = no_dim on, match:class ^(retro-paint-dos)$
windowrule = no_shadow on, match:class ^(retro-paint-dos)$
windowrule = border_size 0, match:class ^(retro-paint-dos)$
windowrule = rounding 0, match:class ^(retro-paint-dos)$

# Desktop (16:9) alternative: if the right monitor is landscape, or you record
# the desktop layout, swap the size/move rules above for a centered 16:9
# window, for example:
#   windowrule = size 1280 720, match:class ^(retro-paint-dos)$
#   windowrule = center on, match:class ^(retro-paint-dos)$
